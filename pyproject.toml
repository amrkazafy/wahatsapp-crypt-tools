[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wacrypt"
version = "0.2.0"
description = "Manage, inspect, migrate and search WhatsApp local backups (crypt14/crypt15)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "amrkazafy" }]
keywords = ["whatsapp", "backup", "crypt15", "msgstore", "forensics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Utilities",
]
# One dependency, and it is the one Python cannot do for us: AES-256-GCM.
# Everything else the tool needs — argparse, tables, progress, the HTML
# template — ships with the standard library, which is what lets wacrypt.py
# stay a single file you can just download and run.
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/amrkazafy/whatsapp-crypt-tools"

[project.scripts]
wacrypt = "wacrypt:main"

# The program is one module at the repository root, not a package.
[tool.setuptools]
py-modules = ["wacrypt"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# wacrypt.py lives at the repository root, so `import wacrypt` needs that root
# on the path when pytest is run from a bare checkout.
pythonpath = ["."]
